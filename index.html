<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>component-004</title>
  </head>
  <body>
    <div id="mfa-app">
      <section class="mfa-player">
        <!-- both of these are driven by whichever tile is active; see dock.js -->
        <h1 class="mfa-player__heading">So Long</h1>

        <!-- cover -->
        <div class="mfa-player__stage">
          <figure class="mfa-player__cover">
            <img
              class="mfa-player__cover-img"
              src="https://picsum.photos/seed/mfa-so-long/900/900"
              alt="So Long — album artwork"
            />
          </figure>
        </div>

        <!-- timeline -->
        <div class="mfa-player__timeline">
          <ul class="mfa-player__track-list">
            <!-- The travelling ring and label. Both are <li> because <ul> only
                 accepts <li> children, but they're absolutely positioned so
                 they sit outside the flex flow, and hidden from AT since the
                 titles are already on the buttons. -->
            <li class="mfa-player__ring" aria-hidden="true"></li>
            <li class="mfa-player__label" aria-hidden="true"></li>

            <li class="mfa-player__track">
              <button
                class="mfa-player__thumb mfa-is-active"
                type="button"
                aria-current="true"
                data-title="So Long"
                data-cover="https://picsum.photos/seed/mfa-so-long/900/900"
              >
                <img src="https://picsum.photos/seed/mfa-so-long/300/300" alt="So Long" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button
                class="mfa-player__thumb"
                type="button"
                data-title="Letting Go"
                data-cover="https://picsum.photos/seed/mfa-t02/900/900"
              >
                <img src="https://picsum.photos/seed/mfa-t02/300/300" alt="Letting Go" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button
                class="mfa-player__thumb"
                type="button"
                data-title="Afterglow"
                data-cover="https://picsum.photos/seed/mfa-t03/900/900"
              >
                <img src="https://picsum.photos/seed/mfa-t03/300/300" alt="Afterglow" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button
                class="mfa-player__thumb"
                type="button"
                data-title="Slow Burn"
                data-cover="https://picsum.photos/seed/mfa-t04/900/900"
              >
                <img src="https://picsum.photos/seed/mfa-t04/300/300" alt="Slow Burn" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button
                class="mfa-player__thumb"
                type="button"
                data-title="Paper Thin"
                data-cover="https://picsum.photos/seed/mfa-t05/900/900"
              >
                <img src="https://picsum.photos/seed/mfa-t05/300/300" alt="Paper Thin" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button
                class="mfa-player__thumb"
                type="button"
                data-title="Undertow"
                data-cover="https://picsum.photos/seed/mfa-t06/900/900"
              >
                <img src="https://picsum.photos/seed/mfa-t06/300/300" alt="Undertow" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button
                class="mfa-player__thumb"
                type="button"
                data-title="Cold Light"
                data-cover="https://picsum.photos/seed/mfa-t07/900/900"
              >
                <img src="https://picsum.photos/seed/mfa-t07/300/300" alt="Cold Light" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button
                class="mfa-player__thumb"
                type="button"
                data-title="Static Bloom"
                data-cover="https://picsum.photos/seed/mfa-t08/900/900"
              >
                <img src="https://picsum.photos/seed/mfa-t08/300/300" alt="Static Bloom" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button
                class="mfa-player__thumb"
                type="button"
                data-title="Dust"
                data-cover="https://picsum.photos/seed/mfa-t09/900/900"
              >
                <img src="https://picsum.photos/seed/mfa-t09/300/300" alt="Dust" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button
                class="mfa-player__thumb"
                type="button"
                data-title="Halcyon"
                data-cover="https://picsum.photos/seed/mfa-t10/900/900"
              >
                <img src="https://picsum.photos/seed/mfa-t10/300/300" alt="Halcyon" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button
                class="mfa-player__thumb"
                type="button"
                data-title="Nearer"
                data-cover="https://picsum.photos/seed/mfa-t11/900/900"
              >
                <img src="https://picsum.photos/seed/mfa-t11/300/300" alt="Nearer" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button
                class="mfa-player__thumb"
                type="button"
                data-title="Hollow"
                data-cover="https://picsum.photos/seed/mfa-t12/900/900"
              >
                <img src="https://picsum.photos/seed/mfa-t12/300/300" alt="Hollow" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button
                class="mfa-player__thumb"
                type="button"
                data-title="Long Way Down"
                data-cover="https://picsum.photos/seed/mfa-t13/900/900"
              >
                <img src="https://picsum.photos/seed/mfa-t13/300/300" alt="Long Way Down" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button
                class="mfa-player__thumb"
                type="button"
                data-title="Ember"
                data-cover="https://picsum.photos/seed/mfa-t14/900/900"
              >
                <img src="https://picsum.photos/seed/mfa-t14/300/300" alt="Ember" />
              </button>
            </li>
          </ul>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
