<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <title>component-004</title>
  </head>
  <body>
    <div id="mfa-app">
      <section class="mfa-cards">
        <!-- both of these are driven by whichever tile is active; see main.js -->
        <h1 class="mfa-cards__title">Ava Bennett</h1>

        <!-- The active team member's photo. Only the resting card is authored
             here — main.js clones it into a small pool of layers so each change
             can own a layer for the whole of its flight from the dock. -->
        <div class="mfa-cards__stage">
          <div class="mfa-cards__card">
            <div class="mfa-cards__card-flip">
              <figure class="mfa-cards__face">
                <img
                  class="mfa-cards__art"
                  src="https://i.pravatar.cc/600?img=1"
                  alt="Ava Bennett"
                />
              </figure>
              <!-- unused now the card flies rather than flips; see style.css -->
              <div class="mfa-cards__face-back" aria-hidden="true"></div>
            </div>
          </div>
        </div>

        <!-- dock: one button per team member. data-title is the name shown in
             the heading and hover label; data-cover is the full-size photo the
             card flies in. The thumb <img> and the cover share the same photo
             (same pravatar id) so the little tile grows seamlessly into the
             big card. Swap these URLs for your own team's names and photos. -->
        <ul class="mfa-cards__dock">
            <!-- The travelling ring and label. Both are <li> because <ul> only
                 accepts <li> children, but they're absolutely positioned so
                 they sit outside the flex flow, and hidden from AT since the
                 names are already on the buttons. -->
            <li class="mfa-cards__ring" aria-hidden="true"></li>
            <li class="mfa-cards__label" aria-hidden="true"></li>

            <li class="mfa-cards__dock-item">
              <button
                class="mfa-cards__thumb mfa-is-active"
                type="button"
                aria-current="true"
                data-title="Ava Bennett"
                data-cover="https://i.pravatar.cc/600?img=1"
              >
                <img src="https://i.pravatar.cc/150?img=1" alt="Ava Bennett" />
              </button>
            </li>
            <li class="mfa-cards__dock-item">
              <button
                class="mfa-cards__thumb"
                type="button"
                data-title="Marcus Reid"
                data-cover="https://i.pravatar.cc/600?img=2"
              >
                <img src="https://i.pravatar.cc/150?img=2" alt="Marcus Reid" />
              </button>
            </li>
            <li class="mfa-cards__dock-item">
              <button
                class="mfa-cards__thumb"
                type="button"
                data-title="Priya Nair"
                data-cover="https://i.pravatar.cc/600?img=3"

                <img src="https://i.pravatar.cc/150?img=3" alt="Priya Nair" />

            </li>
            <li class="mfa-cards__dock-item">

                data-cover="https://i.pravatar.cc/600?img=4"
              >
                <img src="https://i.pravatar.cc/150?img=4" alt="Diego Santos" />
              </button>
            </li>
            <li class="mfa-cards__dock-item">
              <button
                class="mfa-cards__thumb"
                type="button"
                data-title="Hannah Cole"
                data-cover="https://i.pravatar.cc/600?img=5"
              >
                <img src="https://i.pravatar.cc/150?img=5" alt="Hannah Cole" />
              </button>
            </li>
            <li class="mfa-cards__dock-item">

                type="button"

                <img src="https://i.pravatar.cc/150?img=6" alt="Kenji Tanaka" />

            </li>
