<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>component-004</title>
  </head>
  <body>
    <div id="mfa-app">
      <section class="mfa-player">
        <h1 class="mfa-player__heading">Allagi</h1>

        <!-- cover + disc -->
        <div class="mfa-player__stage">
          <div class="mfa-player__disc" aria-hidden="true">
            <span class="mfa-player__disc-sheen"></span>
            <span class="mfa-player__disc-hub"></span>
          </div>
          <figure class="mfa-player__cover">
            <img
              class="mfa-player__cover-img"
              src="https://picsum.photos/seed/mfa-so-long/900/900"
              alt="So Long by Allagi — album artwork"
            />
          </figure>
        </div>

        <!-- timeline -->
        <div class="mfa-player__timeline">
          <ul class="mfa-player__track-list">
            <li class="mfa-player__track">
              <button class="mfa-player__thumb mfa-is-active" type="button" aria-current="true">
                <img src="https://picsum.photos/seed/mfa-so-long/300/300" alt="So Long" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button class="mfa-player__thumb" type="button">
                <img src="https://picsum.photos/seed/mfa-t02/300/300" alt="Track 2" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button class="mfa-player__thumb" type="button">
                <img src="https://picsum.photos/seed/mfa-t03/300/300" alt="Track 3" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button class="mfa-player__thumb" type="button">
                <img src="https://picsum.photos/seed/mfa-t04/300/300" alt="Track 4" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button class="mfa-player__thumb" type="button">
                <img src="https://picsum.photos/seed/mfa-t05/300/300" alt="Track 5" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button class="mfa-player__thumb" type="button">
                <img src="https://picsum.photos/seed/mfa-t06/300/300" alt="Track 6" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button class="mfa-player__thumb" type="button">
                <img src="https://picsum.photos/seed/mfa-t07/300/300" alt="Track 7" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button class="mfa-player__thumb" type="button">
                <img src="https://picsum.photos/seed/mfa-t08/300/300" alt="Track 8" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button class="mfa-player__thumb" type="button">
                <img src="https://picsum.photos/seed/mfa-t09/300/300" alt="Track 9" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button class="mfa-player__thumb" type="button">
                <img src="https://picsum.photos/seed/mfa-t10/300/300" alt="Track 10" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button class="mfa-player__thumb" type="button">
                <img src="https://picsum.photos/seed/mfa-t11/300/300" alt="Track 11" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button class="mfa-player__thumb" type="button">
                <img src="https://picsum.photos/seed/mfa-t12/300/300" alt="Track 12" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button class="mfa-player__thumb" type="button">
                <img src="https://picsum.photos/seed/mfa-t13/300/300" alt="Track 13" />
              </button>
            </li>
            <li class="mfa-player__track">
              <button class="mfa-player__thumb" type="button">
                <img src="https://picsum.photos/seed/mfa-t14/300/300" alt="Track 14" />
              </button>
            </li>
          </ul>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
